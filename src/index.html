<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>sp — sweet spot</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <div id="bg-layer"></div>

  <header id="topbar">
    <div class="brand">sp <span class="brand-sub">sweet spot ♡</span></div>
    <div id="topbar-clock" class="topbar-clock"></div>
    <div class="topbar-actions">
      <button id="btn-walls" class="ghost-btn" title="обои из пинтереста">✦</button>
      <button id="btn-shelf" class="ghost-btn" title="полка виджетов">+</button>
      <button id="btn-settings" class="ghost-btn" title="Настройки">⚙</button>
    </div>
  </header>

  <main id="dashboard"></main>

  <!-- модальные окна -->
  <div id="modal-root" class="hidden"></div>

  <div id="toast-holder"></div>

  <audio id="player-audio"></audio>

  <script src="js/store.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/edupage.js"></script>
  <script src="js/inbox.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/walls.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
